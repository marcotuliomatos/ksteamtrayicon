[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ksteamtrayicon"
version = "1.0.5"
description = "Updates the Steam tray icon to match the current Plasma color scheme."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Marco Matos" }
]
keywords = ["plasma", "kde", "steam", "tray", "dark", "light", "theme", "color", "scheme"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Desktop Environment",
  "Topic :: System :: Monitoring"
]
dependencies = [
  "dbus-next>=0.2.3"
]

[project.scripts]
ksteamtrayicon = "ksteamtrayicon.app:cli"

[project.urls]
Homepage = "https://github.com/marcotuliomatos/ksteamtrayicon"
Repository = "https://github.com/marcotuliomatos/ksteamtrayicon"
Issues = "https://github.com/marcotuliomatos/ksteamtrayicon/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/ksteamtrayicon"]

[tool.hatch.build.targets.wheel.shared-data]
"man/en_US/ksteamtrayicon.1" = "share/man/man1/ksteamtrayicon.1"
"man/pt_BR/ksteamtrayicon.1" = "share/man/pt_BR/man1/ksteamtrayicon.1"

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/man",
  "/README.md",
  "/LICENSE",
  "/pyproject.toml",
]
